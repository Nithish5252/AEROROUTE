# ============================================================
# AeroRoute -- Pytest Configuration (Phase 9)
# File : pytest.ini
# ============================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorized test execution
markers =
    unit: Fast unit tests using synthetic fixtures (No external dependencies)
    mongodb: Integration tests requiring active local MongoDB Community Server
    e2e: End-to-end pipeline integration tests
    performance: Performance and memory benchmark tests

# Filter known deprecation warnings from legacy dependencies
filterwarnings =
    ignore::DeprecationWarning:bson.*
    ignore::DeprecationWarning:pymongo.*
    ignore::UserWarning:joblib.*
    ignore::UserWarning:streamlit.*

# Output formatting
addopts = -v --tb=short --strict-markers
